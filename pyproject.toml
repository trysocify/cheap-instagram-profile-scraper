[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cheap-instagram-profile-scraper"
version = "1.0.0"
description = "Cheap Instagram profile scraper — username in, JSON out via Socify (trysocify.com)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Socify OSS" }]
keywords = [
  "instagram",
  "instagram-profile-scraper",
  "cheap-instagram-profile-scraper",
  "instagram-scraper",
  "instagram-api",
  "socify",
  "scraping",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://trysocify.com/compare/best-instagram-profile-scrapers-2026"
Documentation = "https://trysocify.com/docs/api/instagram/profile"
Pricing = "https://trysocify.com/pricing"
Source = "https://github.com/trysocify/cheap-instagram-profile-scraper"
"Socify" = "https://trysocify.com"

[tool.setuptools.packages.find]
where = ["src"]
